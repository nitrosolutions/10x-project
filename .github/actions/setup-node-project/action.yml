name: Setup Node.js Project
description: Checkout code, setup Node.js, and install dependencies

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc

    - name: Install dependencies
      shell: bash
      run: npm ci
