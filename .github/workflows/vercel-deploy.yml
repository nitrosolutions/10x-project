name: Deploy to Vercel

on:
  workflow_run:
    workflows: ["Test & Build Master"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Vercel Production
    # Uruchom gdy: ręcznie wywołane LUB poprzedni workflow zakończył się sukcesem
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deployment Summary
        run: |
          echo "✅ Deployment to Vercel Production completed successfully!"
          echo "🚀 Project deployed from branch: master"
          echo "📦 Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "🔗 Triggered by workflow: ${{ github.event.workflow_run.name }}"
